<!DOCTYPE html>
<html lang="pt-BR" data-shell="desktop">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' data: https:; style-src 'self' 'unsafe-inline'; script-src 'self' https://cdnjs.cloudflare.com https://cdn.jsdelivr.net; connect-src 'self' https: ws: wss:; font-src 'self' data:; object-src 'none'; base-uri 'self'; form-action 'self'">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#002645">
  <title>PastorHub – Versão Usuário Desktop</title>
  <link rel="stylesheet" href="css/usuario.css?v=6">
  <link rel="stylesheet" href="css/usuario-perfil.css?v=3">
  <link rel="stylesheet" href="css/usuario-home.css?v=2">
</head>
<body>

  <div id="splash">
    <div class="spinner spinner-lime"></div>
    <p>Carregando PastorHub...</p>
  </div>

  <div id="auth" hidden>
    <div class="auth-inner">
      <div class="auth-logo">
        <div class="auth-logo-box">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"/><path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"/></svg>
        </div>
        <h1>PastorHub</h1>
        <p>Versão Usuário Desktop</p>
      </div>
      <div class="auth-card">
        <h2>Bem-vindo, Parceiro</h2>
        <p class="auth-desc">Converse com pastores, veja sermões e agende visitas</p>
        <div class="tabs auth-tabs">
          <button class="tab active" data-auth-tab="login" type="button">Entrar</button>
          <button class="tab" data-auth-tab="signup" type="button">Cadastrar</button>
        </div>
        <form id="auth-login" class="auth-form" autocomplete="off">
          <div class="field">
            <label for="login-email">Email</label>
            <input id="login-email" type="email" placeholder="seu@email.com" required>
          </div>
          <div class="field">
            <label for="login-senha">Senha</label>
            <input id="login-senha" type="password" placeholder="••••••••" required>
          </div>
          <button class="btn primary block" type="submit">Entrar</button>
          <div class="divider"><span>Ou continue com</span></div>
          <button class="btn outline block" type="button" data-action="auth-google">Google</button>
        </form>
        <form id="auth-signup" class="auth-form" hidden autocomplete="off">
          <div class="field">
            <label for="cad-nome">Seu Nome</label>
            <input id="cad-nome" type="text" placeholder="Maria Souza" required>
          </div>
          <div class="field">
            <label for="cad-email">Email</label>
            <input id="cad-email" type="email" placeholder="seu@email.com" required>
          </div>
          <div class="field">
            <label for="cad-senha">Senha</label>
            <input id="cad-senha" type="password" placeholder="Mínimo 6 caracteres" minlength="6" required>
          </div>
          <button class="btn lime block" type="submit">Criar Conta</button>
        </form>
        <p class="auth-foot" data-auth-foot>PastorHub • Versão Usuário</p>
      </div>
    </div>
  </div>

  <!-- App principal (Desktop) -->
  <div id="app" hidden>
    <div class="user-shell">
      <!-- Sidebar -->
      <aside class="user-sidebar">
        <div class="user-sidebar-head">
          <h1>For Imáfia</h1>
          <p>Versão Desktop</p>
        </div>
        <nav class="user-nav">
          <button class="sidebar-item active" data-nav="dashboard" type="button">
            <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4a2 2 0 0 0 1-1.73Z"/><path d="M3.29 7.35 6 9.44l7.4-4.09a2 2 0 0 1 2 0L21 9.44V8"/></svg>
            <span>Início</span>
          </button>
          <button class="sidebar-item" data-nav="chat" type="button">
            <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15a2 2 0 0 1-2 2H8l-5 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
            <span>Conversas</span>
          </button>
          <button class="sidebar-item" data-nav="agenda" type="button">
            <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M8 2v4l4 2-2.5 1M17 21H7a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h12a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2Z"/></svg>
            <span>Agenda</span>
          </button>
          <button class="sidebar-item" data-nav="sermoes" type="button">
            <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 3H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2Z"/><path d="m7 8 2.3 2.3L15 7M7 14l4.7 4.7L15 14"/></svg>
            <span>Sermões</span>
          </button>
          <button class="sidebar-item" data-nav="biblioteca" type="button">
            <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"/><path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"/></svg>
            <span>Biblioteca</span>
          </button>
          <button class="sidebar-item" data-nav="notificacoes" type="button">
            <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19.2 4H18V2M10 6.4V4H6.2A2 2 0 0 0 4 6.2v10.8a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V9M17 17a2 2 0 0 1-2 2H7a4 4 0 0 1-4-4c0-.9.2-1.6.7-2.3L4 7M15.4 7L19 10.6V15a1 1 0 0 1-1 1h-2.6a4 4 0 0 0-7.4-2L8 14"/></svg>
            <span>Notificações</span>
          </button>
        </nav>
        <div class="user-sidebar-foot">
          <button class="user-perfil-btn" data-action="meu-perfil">
            <div class="avatar">P</div>
            <div><span>Perfil</span><small>Editar meu perfil</small></div>
          </button>
          <button class="user-exit-btn" data-action="sair">
            <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4M16 17l5-5-5-5M21 12H8"/></svg>
            <span>Sair</span>
          </button>
        </div>
      </aside>

      <!-- Conteúdo principal -->
      <div class="user-main">
        <header class="user-header">
          <h1 id="user-title"></h1>
          <div class="user-subtitle" id="user-subtitle"></div>
        </header>
        <main class="user-content" id="user-content"></main>
      </div>
    </div>

    <button class="fab-btn" id="fab-agendar" type="button">
      <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 2a10 10 0 0 1 10 10 10.3 10.3 0 0 1-.8 6.2 2 2 0 0 1-1.4 1.58 2 2 0 0 1-.98.09H8.56a2 2 0 0 1-1.94-1.58L7 11Z"/></svg>
    </button>

    <div id="sheet" hidden>
      <div class="sheet-backdrop" data-action="close-sheet"></div>
      <div class="sheet-panel">
        <div class="sheet-head"><span class="sheet-title" id="sheet-title"></span><button class="btn-icon" data-action="close-sheet"><svg class="icon" viewBox="0 0 24 24"><path d="M18 6 6 18M6 6l12 12"/></svg></button></div>
        <p class="sheet-desc" id="sheet-desc"></p>
        <div id="sheet-body"></div>
        <div id="sheet-footer" hidden></div>
      </div>
    </div>
  </div>

  <div id="toast-root"></div>
  <script src="js/app-shell.js?v=1"></script>
  <script src="js/icons.js?v=4"></script>
  <script src="js/ui.js?v=2"></script>
  <script src="js/config.js"></script>
  <script src="js/supabase-client.js"></script>
  <script src="js/biblioteca.js?v=2"></script>
  <script src="js/usuario-perfil.js?v=10"></script>
  <script src="js/usuario-home.js?v=3"></script>
  <script src="js/usuario-menu.js?v=1"></script>
  <script src="js/usuario.js?v=10"></script>
  <script src="js/demo.js"></script>
</body>
</html>
