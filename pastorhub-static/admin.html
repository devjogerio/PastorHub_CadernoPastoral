<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' data: https:; style-src 'self' 'unsafe-inline'; script-src 'self' https://cdnjs.cloudflare.com https://cdn.jsdelivr.net; connect-src 'self' https: ws: wss:; font-src 'self' data:; object-src 'none'; base-uri 'self'; form-action 'self'">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PastorHub Admin – Painel de gestão</title>
  <link rel="stylesheet" href="css/admin.css?v=2">
</head>
<body>

  <!-- ===== Login ===== -->
  <div class="admin-login" id="admin-login">
    <div class="login-box">
      <div class="logo">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m18 15-6-6-6 6"/></svg>
      </div>
      <h1>PastorHub Admin</h1>
      <p>Acesso restrito à administração da plataforma.</p>
      <p class="login-demo-note">Sem Supabase configurado (js/config.js), o acesso é de demonstração.</p>

      <!-- Login social -->
      <button class="btn btn-google" id="btn-google" type="button">
        <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path fill="#4285F4" d="M23.49 12.27c0-.79-.07-1.54-.19-2.27H12v4.51h6.47c-.29 1.48-1.14 2.73-2.4 3.58v3h3.86c2.26-2.09 3.56-5.17 3.56-8.82z"/><path fill="#34A853" d="M12 24c3.24 0 5.95-1.08 7.93-2.91l-3.86-3c-1.08.72-2.45 1.16-4.07 1.16-3.13 0-5.78-2.11-6.73-4.96H1.29v3.09C3.26 21.3 7.31 24 12 24z"/><path fill="#FBBC05" d="M5.27 14.29c-.25-.72-.38-1.49-.38-2.29s.14-1.57.38-2.29V6.62H1.29A11.86 11.86 0 0 0 0 12c0 1.94.46 3.77 1.29 5.38l3.98-3.09z"/><path fill="#EA4335" d="M12 4.75c1.77 0 3.35.61 4.6 1.8l3.42-3.42C17.95 1.19 15.24 0 12 0 7.31 0 3.26 2.7 1.29 6.62l3.98 3.09C6.22 6.86 8.87 4.75 12 4.75z"/></svg>
        Continuar com Google
      </button>

      <div class="login-or"><span>ou entre com e-mail</span></div>

      <!-- Login por e-mail -->
      <form id="login-form" novalidate>
        <div class="field"><label for="adm-email">E-mail</label><input id="adm-email" type="email" inputmode="email" autocomplete="username" spellcheck="false" placeholder="nome@exemplo.com" required></div>
        <div class="field"><label for="adm-senha">Senha</label><input id="adm-senha" type="password" autocomplete="current-password" placeholder="Sua senha" required></div>
        <button class="btn btn-primary" type="submit">Entrar com e-mail</button>
      </form>

      <!-- Acesso rápido (contas de demonstração) -->
      <div class="login-quick">
        <button class="btn btn-outline" type="button" data-login-rapido="admin">Entrar como administrador</button>
        <button class="btn btn-outline" type="button" data-login-rapido="ana">Entrar como Ana (usuário comum)</button>
      </div>
    </div>
  </div>

  <!-- ===== Painel ===== -->
  <div class="admin-layout" id="admin-app" hidden>
    <aside class="aside" id="admin-aside">
      <div class="aside-brand">
        <span class="mark"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2 4 6v6c0 5 3.4 9.4 8 10 4.6-.6 8-5 8-10V6z"/><path d="m9 12 2 2 4-4"/></svg></span>
        <div><strong>PastorHub</strong><span>Painel administrativo</span></div>
      </div>
      <nav class="aside-nav" id="admin-nav"></nav>
      <div class="aside-foot">
        <button class="aside-foot-user" type="button" data-section="perfil" title="Ver meu perfil">
          <span class="avatar">AD</span>
          <span class="aside-foot-info"><b>Administrador</b><span>admin@pastorhub.app</span></span>
        </button>
        <a href="site.html" title="Ir para o site">↗</a>
        <button class="aside-foot-out" type="button" data-action="sair" title="Sair do painel" aria-label="Sair do painel">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><path d="m16 17 5-5-5-5"/><path d="M21 12H9"/></svg>
        </button>
      </div>
    </aside>

    <div class="admin-main">
      <header class="admin-top">
        <button class="icon-btn menu-btn" id="menu-btn" aria-label="Menu">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 6h16M4 12h16M4 18h16"/></svg>
        </button>
        <div>
          <h1 id="page-title">Visão geral</h1>
          <div class="crumb" id="page-crumb">PastorHub · Painel administrativo</div>
        </div>
        <div class="admin-search">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>
          <input id="global-search" type="text" placeholder="Buscar no painel..." autocomplete="off">
          <div class="search-pop" id="search-pop" hidden></div>
        </div>
        <button class="icon-btn" id="theme-btn" title="Alternar tema claro/escuro">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" id="theme-icon"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
        </button>
        <button class="icon-btn" id="refresh-btn" title="Atualizar">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M23 4v6h-6"/><path d="M1 20v-6h6"/><path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10"/><path d="M1 14l4.64 4.36A9 9 0 0 0 20.49 15"/></svg>
        </button>
      </header>

      <div class="admin-content" id="admin-content"></div>
    </div>
  </div>

  <div class="aside-backdrop" id="aside-backdrop"></div>
  <nav class="mobile-nav" id="mobile-nav" aria-label="Navegação rápida"></nav>

  <div id="admin-toasts"></div>
  <div id="admin-modal-root"></div>

  <script src="js/icons.js"></script>
  <script src="js/investidor.js?v=2"></script>
  <script src="js/imagem.js"></script>
  <script src="js/config.js"></script>
  <script src="js/supabase-client.js"></script>
  <script src="js/admin.js?v=3"></script>
  <script src="js/admin-busca-core.js?v=1"></script>
  <script src="js/admin-busca.js?v=1"></script>
  <script src="js/ai.js"></script>
  <script src="js/versiculos.js"></script>
  <script src="js/admin-ai.js"></script>
  <script src="js/biblioteca.js?v=2"></script>
  <script src="js/admin-biblioteca.js?v=4"></script>
  <script src="js/admin-planos.js"></script>
  <script src="js/admin-vers.js"></script>
  <script src="js/demo.js"></script>
</body>
</html>
