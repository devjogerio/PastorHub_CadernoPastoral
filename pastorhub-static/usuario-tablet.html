<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#002645">
  <title>PastorHub – Versão Usuário Tablet</title>
  <link rel="stylesheet" href="css/usuario.css">
</head>
<body>

  <!-- Splash -->
  <div id="splash">
    <div class="spinner spinner-lime"></div>
    <p>Carregando PastorHub...</p>
  </div>

  <!-- Auth -->
  <div id="auth" hidden>
    <div class="auth-inner">
      <div class="auth-logo">
        <div class="auth-logo-box">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"/><path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"/></svg>
        </div>
        <h1>PastorHub</h1>
        <p>Versão Usuário Tablet</p>
      </div>
      <div class="auth-card">
        <h2>Bem-vindo, Parceiro</h2>
        <p class="auth-desc">Entre para conversar com pastores e ver sermões</p>
        <div class="tabs auth-tabs">
          <button class="tab active" data-auth-tab="login" type="button">Entrar</button>
          <button class="tab" data-auth-tab="signup" type="button">Cadastrar</button>
        </div>
        <form id="auth-login" class="auth-form" autocomplete="off">
          <div class="field">
            <label for="login-email">Email</label>
            <input id="login-email" type="email" placeholder="seu@email.com" required>
          </div>
          <div class="field">
            <label for="login-senha">Senha</label>
            <input id="login-senha" type="password" placeholder="••••••••" required>
          </div>
          <button class="btn primary block" type="submit">Entrar</button>
          <div class="divider"><span>Ou continue com</span></div>
          <button class="btn outline block" type="button" data-action="auth-google">Google</button>
        </form>
        <form id="auth-signup" class="auth-form" hidden autocomplete="off">
          <div class="field">
            <label for="cad-nome">Seu Nome</label>
            <input id="cad-nome" type="text" placeholder="Maria Souza" required>
          </div>
          <div class="field">
            <label for="cad-email">Email</label>
            <input id="cad-email" type="email" placeholder="seu@email.com" required>
          </div>
          <div class="field">
            <label for="cad-senha">Senha</label>
            <input id="cad-senha" type="password" placeholder="Mínimo 6 caracteres" minlength="6" required>
          </div>
          <button class="btn lime block" type="submit">Criar Conta</button>
        </form>
        <p class="auth-foot">PastorHub • Versão Usuário • Tablet</p>
      </div>
    </div>
  </div>

  <!-- App principal (Tablet) -->
  <div id="app" hidden>
    <header id="topbar">
      <button class="btn-icon" id="btn-menu" aria-label="Abrir menu" type="button">
        <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 6h16M4 12h16M4 18h16"/></svg>
      </button>
      <div class="topbar-title">
        <h1>For Imáfia</h1>
      </div>
    </header>

    <div id="drawer" hidden>
      <div class="drawer-backdrop" data-action="close-drawer"></div>
      <aside class="drawer-panel" role="dialog">
        <div class="drawer-head">
          <div><h2>Menu do Usuário</h2><p>Versão Tablet</p></div>
          <button class="btn-icon dark" data-action="close-drawer" type="button">
            <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 6 6 18M6 6l12 12"/></svg>
          </button>
        </div>
        <div class="drawer-profile" id="drawer-profile"></div>
        <nav class="drawer-menu">
          <button data-action="meu-perfil" type="button">Meu Perfil</button>
          <button data-nav="chat" type="button">Conversas</button>
          <button data-nav="agenda" type="button">Agenda</button>
          <button data-nav="sermoes" type="button">Sermões</button>
          <button data-action="sair" type="button">Sair</button>
        </nav>
      </aside>
    </div>

    <!-- Sidebar para tablet -->
    <div class="user-sidebar" hidden id="user-sidebar">
      <button class="sidebar-item active" data-nav="dashboard" type="button">
        <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4a2 2 0 0 0 1-1.73Z"/><path d="M3.29 7.35 6 9.44l7.4-4.09a2 2 0 0 1 2 0L21 9.44V8"/></svg>
        <span>Início</span>
      </button>
      <button class="sidebar-item" data-nav="chat" type="button">
        <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15a2 2 0 0 1-2 2H8l-5 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
        <span>Conversas</span>
      </button>
      <button class="sidebar-item" data-nav="agenda" type="button">
        <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M8 2v4l4 2-2.5 1M17 21H7a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h12a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2Z"/></svg>
        <span>Agenda</span>
      </button>
      <button class="sidebar-item" data-nav="sermoes" type="button">
        <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 3H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2Z"/><path d="m7 8 2.3 2.3L15 7M7 14l4.7 4.7L15 14"/></svg>
        <span>Sermões</span>
      </button>
    </div>

    <div class="user-layout">
      <main class="user-content" id="user-content"></main>
      <aside class="user-right" id="user-right"></aside>
    </div>

    <button class="fab-btn" id="fab-agendar" type="button">
      <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 2a10 10 0 0 1 10 10 10.3 10.3 0 0 1-.8 6.2 2 2 0 0 1-1.4 1.58 2 2 0 0 1-.98.09H8.56a2 2 0 0 1-1.94-1.58L7 11Z"/></svg>
    </button>

    <div id="sheet" hidden>
      <div class="sheet-backdrop" data-action="close-sheet"></div>
      <div class="sheet-panel">
        <div class="sheet-head"><span class="sheet-title"></span><button class="btn-icon" data-action="close-sheet"><svg class="icon" viewBox="0 0 24 24"><path d="M18 6 6 18M6 6l12 12"/></svg></button></div>
        <p class="sheet-desc"></p>
        <div id="sheet-body"></div>
        <div id="sheet-footer" hidden></div>
      </div>
    </div>
  </div>

  <div id="toast-root"></div>
  <script>window.APP_SHELL = 'tablet';</script>
  <script src="js/icons.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/usuario.js"></script>
</body>
</html>
