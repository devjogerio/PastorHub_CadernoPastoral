name: Publicar demonstração estática

on:
  push:
    branches: [main]
    paths:
      - pastorhub-static/**
      - .github/workflows/pages.yml
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    name: GitHub Pages
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Configurar Pages
        uses: actions/configure-pages@v5
      - name: Preparar pacote estático
        run: |
          mkdir -p _site
          cp -R pastorhub-static/. _site/
      - name: Enviar artefato
        uses: actions/upload-pages-artifact@v5
        with:
          path: _site
      # O servico de listagem do deploy-pages pode demorar ate ~60s para ver
      # um artefato recem-finalizado (actions/deploy-pages#451).
      - name: Aguardar visibilidade do artefato
        run: sleep 60
      - name: Publicar
        id: deployment
        uses: actions/deploy-pages@v5
